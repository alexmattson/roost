<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roost</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/roost/icons/icon32.png">
  <link rel="icon" type="image/png" sizes="128x128" href="/roost/icons/icon128.png">
  <!-- Installable PWA: home-screen icon + standalone app shell -->
  <link rel="manifest" href="/roost/manifest.webmanifest">
  <meta name="theme-color" content="#edeae2">
  <link rel="apple-touch-icon" href="/roost/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Roost">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <script>
    /* Set the theme before first paint so the page never flashes the wrong one. */
    (() => {
      try {
        const stored = localStorage.getItem('sp_theme');
        document.documentElement.dataset.theme = stored || 'light';
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    })();
  </script>
</head>
<body class="expanded web">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
